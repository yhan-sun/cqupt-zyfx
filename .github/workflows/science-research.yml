name: Scientific running reference preparation
on:
  push:
    branches: [feat/scientific-running]
    paths: [.github/workflows/science-research.yml]
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p research
          git archive HEAD -o research/source.tar
          python -m pip install Pillow==11.3.0
      - name: Retrieve selected openly licensed movement assets
        run: |
          python - <<'PY'
          import hashlib, json, time, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          out=Path('research/movements'); out.mkdir()
          cdc=['Squat','Lunge','Step up','Toe stand','Hip abduction','Knee curl','Knee extension','Hamstring stretch','Quad stretch','Chest stretch','Wallpushup']
          files=[x+'-CDC strength training for older adults.gif' for x in cdc]+['Highknees wbs.gif','Squats 01.gif','Bridge-1.png','Bridge-2.png','Side-plank-1.png','Side-plank-2.png']
          report=[]
          for n,title in enumerate(files):
              filename=title.replace(' ','_'); h=hashlib.md5(filename.encode()).hexdigest()
              url='https://upload.wikimedia.org/wikipedia/commons/'+h[0]+'/'+h[:2]+'/'+urllib.parse.quote(filename)
              entry={'title':title,'filename':filename,'url':url,'source':'https://commons.wikimedia.org/wiki/File:'+urllib.parse.quote(filename)}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'CQUPT-Running-Education/1.0 (https://github.com/yhan-sun/cqupt-zyfx)'})
                  with urllib.request.urlopen(req,timeout=25) as r: raw=r.read(8000000)
                  (out/filename).write_bytes(raw)
                  with Image.open(out/filename) as im:
                      entry.update(width=im.width,height=im.height,frames=getattr(im,'n_frames',1),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
                      im.seek(min(2,getattr(im,'n_frames',1)-1)); im.convert('RGB').save(out/(str(n)+'.jpg'))
                  print('OK',filename,entry['frames'])
              except Exception as e: entry['error']=str(e); print('FAILED',filename,str(e))
              report.append(entry); time.sleep(.7)
          (Path('research')/'movements.json').write_text(json.dumps(report,indent=2))
          thumbs=[]
          for n,item in enumerate(report):
              if 'error' in item: continue
              canvas=Image.new('RGB',(280,250),'white')
              pic=ImageOps.contain(Image.open(out/(str(n)+'.jpg')),(240,190)); canvas.paste(pic,((280-pic.width)//2,5))
              ImageDraw.Draw(canvas).text((8,202),str(n)+' '+item['title'][:30],fill='black')
              ImageDraw.Draw(canvas).text((8,223),str(item['frames'])+' frames',fill='black'); thumbs.append(canvas)
          sheet=Image.new('RGB',(280*4,250*((len(thumbs)+3)//4)), '#eeeeee')
          for n,pic in enumerate(thumbs): sheet.paste(pic,((n%4)*280,(n//4)*250))
          sheet.save('research/contact-sheet.jpg')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: science-research
          path: research/
          retention-days: 7
