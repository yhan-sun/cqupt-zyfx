name: Website · test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      export_preview:
        description: Export the standalone offline preview
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Reuse validated image sources
        uses: actions/cache@v4
        with:
          path: |
            .cache/*.source
            .cache/science
            .cache/official
            .cache/fallback
          key: website-sources-${{ hashFiles('data/media.json', 'data/media-fallback.json', 'data/science-media.json', 'data/official-media.json') }}
          restore-keys: website-sources-
      - run: npm run build
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser acceptance runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Browser acceptance
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          node scripts/serve.mjs --dir dist --base /cqupt-zyfx/ &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/cqupt-zyfx/ > /dev/null; then break; fi
            sleep 1
          done
          timeout 300s npm run test:e2e
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Export optional offline preview
        if: github.event_name == 'workflow_dispatch' && inputs.export_preview
        run: npm run preview:export
      - name: Save optional preview
        if: github.event_name == 'workflow_dispatch' && inputs.export_preview
        uses: actions/upload-artifact@v4
        with:
          name: interactive-preview
          path: cqupt-campus-preview.html
          retention-days: 7
      - name: Save website
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published revision and resources
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-published.mjs
