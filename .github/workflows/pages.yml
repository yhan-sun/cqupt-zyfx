name: Website · test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Unit and content tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install Pillow==11.3.0
      - name: Reuse hash-pinned movement sources
        uses: actions/cache@v4
        with:
          path: .cache/science
          key: movement-sources-${{ hashFiles('data/science-media.json') }}
      - name: Reuse hash-pinned official-account photographs
        uses: actions/cache@v4
        with:
          path: .cache/official
          key: official-account-sources-${{ hashFiles('data/official-media.json') }}
      - name: Build complete website
        run: npm run build
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Club culture, association, gallery, motion, responsive and no-JS checks
        env:
          REQUIRE_LOCAL_MEDIA: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          node scripts/serve.mjs --dir dist --base /cqupt-zyfx/ &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/cqupt-zyfx/ > /dev/null; then break; fi
            sleep 1
          done
          timeout 220s python tests/structure_browser.py
          timeout 120s python tests/motion_browser.py
          timeout 120s python tests/association_browser.py
      - name: Save screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Export offline interactive preview
        run: node scripts/preview.mjs
      - name: Save interactive preview
        uses: actions/upload-artifact@v4
        with:
          name: interactive-preview
          path: cqupt-campus-preview.html
          retention-days: 14
      - name: Save portable website
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published association, club culture, motion and gallery
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.request
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          checks = {
              'about.html': ['从跑完一圈气喘', '胡钢', '2025级', '清远马拉松校内宣讲', 'assets/association.css', 'assets/motion.js'],
              'club.html': ['一起训练', '协会近照', '20', '校园主场', '全国第6', 'assets/motion.js'],
              'gallery.html': ['跑过的地方', '协会实拍', '20', 'assets/motion.js'],
              'join.html': ['468686951', '加入重邮约跑团'],
              'science.html': ['科学跑步'],
              'news.html': ['已并入「赛事与足迹」']
          }
          for path, needles in checks.items():
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(base + path, timeout=20) as response:
                          text = response.read().decode('utf-8')
                          assert response.status == 200
                          assert all(needle in text for needle in needles)
                          assert '跑步服务' not in text.split('<nav id="main-nav"',1)[1].split('</nav>',1)[0]
                          print('PASS published', path)
                      break
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(5)
          for path in [
              'assets/association/qingyuan-briefing-2026.webp',
              'assets/association/college-track-awards-2026.webp',
              'assets/association/hu-gang-running.webp',
              'media/official/2025-track-training.webp'
          ]:
              with urllib.request.urlopen(base + path, timeout=20) as response:
                  raw = response.read(16)
                  assert raw.startswith(b'RIFF') and b'WEBP' in raw
                  print('PASS published', path)
          for path in ['assets/motion.js','assets/motion.css','assets/association.css']:
              with urllib.request.urlopen(base + path, timeout=20) as response:
                  raw=response.read()
                  assert response.status==200 and len(raw)>1000
                  print('PASS published', path)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Published association story\n\n' + base + 'about.html\n\nVerified the standalone association page, member-supplied photographs, chairman statement, club/archive integration, gallery filter, motion runtime, join path and representative photographs over public HTTPS.\n')
          PY
