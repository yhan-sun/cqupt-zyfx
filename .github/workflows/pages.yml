name: Website · test and deploy

on:
  push:
    branches: [main, design/cqupt-campus-style, feat/scientific-running]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Unit and content tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install Pillow==11.3.0
      - name: Build and optimize campus photography and exercise media
        run: npm run build
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Desktop, mobile, keyboard and no-JS checks
        env:
          REQUIRE_LOCAL_MEDIA: '1'
        run: |
          node scripts/serve.mjs --dir dist --base /cqupt-zyfx/ &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/cqupt-zyfx/ > /dev/null; then break; fi
            sleep 1
          done
          python tests/browser.py
          python tests/science_browser.py
      - name: Save screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Export offline interactive preview
        run: node scripts/preview.mjs
      - name: Save interactive preview
        uses: actions/upload-artifact@v4
        with:
          name: interactive-preview
          path: cqupt-campus-preview.html
          retention-days: 14
      - name: Save portable website
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published science pages and GIF
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.request
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          paths = ['science.html'] + ['science/' + name + '.html' for name in ['warm-up', 'stretching', 'training', 'strength', 'nutrition', 'recovery', 'references']]
          paths.append('media/science/chair-squat.gif')
          for path in paths:
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(base + path, timeout=20) as response:
                          raw = response.read()
                          assert response.status == 200
                          if path.endswith('.gif'):
                              assert raw.startswith((b'GIF87a', b'GIF89a'))
                          else:
                              assert '科学跑步' in raw.decode('utf-8')
                          print('PASS published', path)
                      break
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(5)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Published science section\n\n' + base + 'science.html\n\nVerified all eight science pages and an original exercise GIF over public HTTPS.\n')
          PY
