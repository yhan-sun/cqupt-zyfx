name: Footprint photo audit
on:
  push:
    branches: [feat/footprint-culture]
    paths: [.github/workflows/photo-audit.yml]
permissions:
  contents: read
concurrency:
  group: footprint-photo-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Fetch supplied official-account articles and enumerate photographs
        run: |
          python - <<'PY'
          import hashlib, html, json, re, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw

          articles = [
            ('recruit-2025','https://mp.weixin.qq.com/s/rFnYKMVPCkgz5MUhlAGItQ'),
            ('qingyuan-2026','https://mp.weixin.qq.com/s/oLYmMv0S4soq2ChWtPLHWg'),
            ('test-2025','https://mp.weixin.qq.com/s/fZVA4Lsqpr102jepbY_npQ'),
            ('cqmarathon-2025','https://mp.weixin.qq.com/s/U_4tlKjOeIJlLzvHX20Acw'),
            ('relay-2024','https://mp.weixin.qq.com/s/JmoIiIjkod0naGt8qbe_ow'),
            ('guiyang-2024','https://mp.weixin.qq.com/s/C-GQGBGGyfbhJroNFiP3_Q'),
            ('night-2024','https://mp.weixin.qq.com/s/0jrkMYn-sz61tvc6fPbs8w'),
            ('qingyuan-2025','https://mp.weixin.qq.com/s/t6qtceKISqwcFAXWZ6vF0g')
          ]
          root=Path('photo-audit'); rawdir=root/'raw'; rawdir.mkdir(parents=True)
          all_items=[]
          headers={'User-Agent':'Mozilla/5.0 (Linux; Android 14; Pixel 8 Pro) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36 MicroMessenger/8.0','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://mp.weixin.qq.com/'}

          def fetch_image(args):
            article_id, article_url, idx, u=args
            try:
              req=urllib.request.Request(u,headers={**headers,'Referer':article_url})
              with urllib.request.urlopen(req,timeout=6) as r: data=r.read(8_000_001)
              if len(data)>8_000_000: return None
              im=Image.open(BytesIO(data)); im.load(); w,h=im.size
              if w<280 or h<180: return None
              return {'article':article_id,'index':idx,'url':u,'width':w,'height':h,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'data':data}
            except Exception:
              return None

          for article_id,url in articles:
            print('ARTICLE', article_id, flush=True)
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=15) as r: text=r.read().decode('utf-8','ignore')
            candidates=[]
            for match in re.findall(r'data-src=["\']([^"\']*mmbiz\.qpic\.cn[^"\']+)', text):
              u=html.unescape(match.replace('\\/','/')).replace('&amp;','&')
              if u.startswith('//'): u='https:'+u
              if u not in candidates: candidates.append(u)
            if len(candidates)<3:
              for match in re.findall(r'(?:src)=["\']([^"\']*mmbiz\.qpic\.cn[^"\']+)', text):
                u=html.unescape(match.replace('\\/','/')).replace('&amp;','&')
                if u.startswith('//'): u='https:'+u
                if u not in candidates: candidates.append(u)
            candidates=candidates[:35]
            print(' candidates used',len(candidates),flush=True)
            article_items=[]
            with ThreadPoolExecutor(max_workers=12) as pool:
              futures=[pool.submit(fetch_image,(article_id,url,idx,u)) for idx,u in enumerate(candidates)]
              for future in as_completed(futures):
                item=future.result()
                if not item: continue
                filename=f"{article_id}-{item['index']:02d}.jpg"
                Image.open(BytesIO(item.pop('data'))).convert('RGB').save(rawdir/filename,quality=90)
                item['file']=filename; article_items.append(item); all_items.append(item)
            article_items.sort(key=lambda x:x['index'])
            print(' usable',len(article_items),flush=True)
            thumbs=[]
            for item in article_items:
              im=Image.open(rawdir/item['file']).convert('RGB'); pic=ImageOps.fit(im,(260,180),method=Image.Resampling.LANCZOS)
              card=Image.new('RGB',(280,230),'white'); card.paste(pic,(10,10)); draw=ImageDraw.Draw(card)
              draw.text((10,195),f"{article_id}  #{item['index']}  {item['width']}x{item['height']}",fill='black'); thumbs.append(card)
            if thumbs:
              cols=4; rows=(len(thumbs)+cols-1)//cols; sheet=Image.new('RGB',(cols*280,rows*230),(236,240,239))
              for i,card in enumerate(thumbs): sheet.paste(card,((i%cols)*280,(i//cols)*230))
              sheet.save(root/(article_id+'-sheet.jpg'),quality=90)
          (root/'images.json').write_text(json.dumps(sorted(all_items,key=lambda x:(x['article'],x['index'])),ensure_ascii=False,indent=2))
          print('TOTAL',len(all_items),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: footprint-photo-audit
          path: photo-audit/
          retention-days: 7
