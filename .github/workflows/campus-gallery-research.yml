name: Campus gallery references
on:
  push:
    branches: [design/cqupt-campus-style]
    paths: [.github/workflows/campus-gallery-research.yml]
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - name: Read public campus sources
        run: |
          python - <<'PY'
          import io,json,re
          from pathlib import Path
          from urllib.parse import urljoin
          from concurrent.futures import ThreadPoolExecutor
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          out=Path('references');out.mkdir()
          pages={
            'gallery':'https://www.cqupt.edu.cn/xywh/xyfg.htm',
            'stadium':'https://tyxy.cqupt.edu.cn/xygk/cdss.htm',
            'clubs':'https://tyxy.cqupt.edu.cn/qthd/tyst.htm',
            'events':'https://tyxy.cqupt.edu.cn/qthd/ppss.htm'
          }
          images=[];links=[]
          s=requests.Session()
          for name,url in pages.items():
            try:
              r=s.get(url,timeout=25);r.raise_for_status();r.encoding='utf-8'
              (out/(name+'.html')).write_text(r.text)
              soup=BeautifulSoup(r.text,'html.parser')
              (out/(name+'.txt')).write_text(soup.get_text(' ',strip=True))
              for a in soup.select('a[href]'):
                label=a.get_text(' ',strip=True)
                if label and any(t in label for t in ['运动场','太极','风光','马拉松','跑步','自邮','约跑','运动会']):links.append({'page':name,'text':label,'url':urljoin(url,a['href'])})
              urls=[urljoin(url,i['src']) for i in soup.select('img[src]')]
              urls += [urljoin(url,m) for m in re.findall(r'url\([\'\"]?([^\)\'\"]+)',r.text)]
              for i,image_url in enumerate(dict.fromkeys(urls)):
                if i>75: break
                images.append({'page':name,'source':url,'url':image_url,'id':f'{name}-{i:02d}'})
            except Exception as e: print(name,e)
          def dl(item):
            try:
              r=s.get(item['url'],timeout=20);r.raise_for_status()
              image=Image.open(io.BytesIO(r.content));item['width'],item['height']=image.size
              if image.width<400 or image.height<200:return
              filename=item['id']+'.'+image.format.lower().replace('jpeg','jpg')
              (out/filename).write_bytes(r.content);item['filename']=filename
              image.thumbnail((1600,1200));image.convert('RGB').save(out/(item['id']+'-thumb.jpg'),quality=85)
            except Exception as e:item['error']=str(e)[:100]
          with ThreadPoolExecutor(max_workers=6) as pool:list(pool.map(dl,images))
          (out/'manifest.json').write_text(json.dumps(images,ensure_ascii=False,indent=2))
          (out/'links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2))
          print(json.dumps(links,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: more-campus-references
          path: references/
          retention-days: 7
