name: Campus design research
on:
  push:
    branches: [design/cqupt-campus-style]
    paths: [.github/workflows/design-research.yml]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install requests beautifulsoup4 pillow playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Collect selected public reference pages and images
        run: |
          python - <<'PY'
          import json, re, io
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from playwright.sync_api import sync_playwright
          out = Path('research')
          out.mkdir()
          pages = {
            'official':'https://www.cqupt.edu.cn/',
            'sports':'https://tyxy.cqupt.edu.cn/',
            'youth':'https://tuanwei.cqupt.edu.cn/',
            'race2026':'https://www.cqnews.net/web/content_1487904406326575104.html',
            'race2025':'https://www.cq.chinanews.com.cn/news/2025/0330/39-48269.html',
            'race2024':'https://chongqing.eol.cn/cqzy/202403/t20240323_2571457.shtml'
          }
          manifest = []
          links = []
          session = requests.Session()
          session.headers['User-Agent']='Mozilla/5.0 (compatible; CQUPT-Website-Research/1.0)'
          for name, url in pages.items():
            try:
              response = session.get(url, timeout=22)
              response.raise_for_status()
              response.encoding='utf-8'
              text = response.text
              (out / (name+'.html')).write_text(text)
              soup = BeautifulSoup(text, 'html.parser')
              (out / (name+'.txt')).write_text(soup.get_text(' ', strip=True))
              for a in soup.select('a[href]'):
                label = a.get_text(' ',strip=True)
                if any(k in label for k in ['风光','马拉松','跑步','场地','体育社团','校园文化']):
                  links.append({'page':name,'text':label,'url':urljoin(url,a['href'])})
              for index, link in enumerate(soup.select('link[rel=stylesheet]')[:9]):
                css_url=urljoin(url,link['href'])
                try:
                  css=session.get(css_url,timeout=12); css.raise_for_status(); css.encoding='utf-8'
                  (out/f'{name}-{index}.css').write_text(css.text)
                except Exception as e: print('CSS',str(e)[:160])
              candidates = []
              for img in soup.select('img'):
                value=img.get('data-src') or img.get('src')
                if value and not value.startswith('data:'): candidates.append((urljoin(url,value),img.get('alt','')))
              for m in re.findall(r'(?:background(?:-image)?\s*:[^;]*?url\([\'\"]?)([^\)\'\"]+)',text): candidates.append((urljoin(url,m),''))
              seen=set()
              for index,(image_url,alt) in enumerate(candidates[:65]):
                if image_url in seen: continue
                seen.add(image_url)
                manifest.append({'page':name,'source':url,'url':image_url,'alt':alt,'filename':f'{name}-{index:02d}.jpg'})
            except Exception as e: print(name,str(e)[:250])
          def download(item):
            try:
              response=session.get(item['url'],timeout=15); response.raise_for_status()
              if len(response.content)>15000000: return
              image=Image.open(io.BytesIO(response.content))
              item['width'],item['height']=image.size
              if image.width<200 and image.height<100: return
              original_ext=(image.format or 'png').lower().replace('jpeg','jpg')
              original_name=item['filename'].rsplit('.',1)[0]+'.'+original_ext
              (out/original_name).write_bytes(response.content)
              item['original']=original_name
              image.thumbnail((1600,1200))
              image.convert('RGB').save(out/item['filename'],quality=86)
              item['downloaded']=True
            except Exception as e: item['error']=str(e)[:160]
          with ThreadPoolExecutor(max_workers=8) as pool: list(pool.map(download,manifest))
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          (out/'links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2))
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            page=browser.new_page(viewport={'width':1440,'height':1000},device_scale_factor=1)
            for name in ['official','youth']:
              try:
                page.goto(pages[name],wait_until='domcontentloaded',timeout=40000)
                page.wait_for_timeout(3000)
                page.screenshot(path=str(out/(name+'-screen.png')),full_page=True,timeout=20000)
              except Exception as e: print('SCREENSHOT',name,str(e)[:160])
            browser.close()
          print(json.dumps(links,ensure_ascii=False,indent=2))
          print('Downloaded',sum(bool(i.get('downloaded')) for i in manifest),'reference images')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-references
          path: research/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: source-baseline
          path: |
            .
            !.git
            !research
          include-hidden-files: true
          retention-days: 7
